<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arcana</title>
    <link rel="icon" href="/arcana-mark.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/arcana-mark.png" />
    <meta name="theme-color" content="#b60003" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    />
    <script>
      try {
        var t = localStorage.getItem("arcana.theme");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        background: #fff;
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body,
      html[data-theme="dark"] #root {
        background: #191919;
      }
      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
      }
      html[data-theme="dark"] .boot-splash {
        background: #191919;
      }
      .boot-splash .arcana-logo {
        width: 88px;
        height: 56px;
        overflow: visible;
      }
      .boot-splash .arcana-logo-d {
        transform-box: fill-box;
        transform-origin: center;
        animation: arcana-logo-loop 1.8s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        animation-delay: calc(var(--d, 0) * 70ms - 1.8s);
      }
      @keyframes arcana-logo-loop {
        0% {
          opacity: 0;
          transform: scale(0.28);
        }
        14% {
          opacity: 1;
          transform: scale(1.06);
        }
        20% {
          opacity: 1;
          transform: scale(1);
        }
        78% {
          opacity: 1;
          transform: scale(1);
        }
        90%,
        100% {
          opacity: 0;
          transform: scale(0.28);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash .arcana-logo-d {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" class="boot-splash" role="status" aria-label="読み込み中">
      <svg viewBox="0 0 412 263" fill="none" xmlns="http://www.w3.org/2000/svg" class="arcana-logo" aria-hidden="true">
        <g class="arcana-logo-d" style="--d: 0">
          <rect x="130.757" y="0.385742" width="81.8374" height="81.8374" transform="rotate(45 130.757 0.385742)" fill="#B60003" />
        </g>
        <g class="arcana-logo-d" style="--d: 2">
          <rect x="203.825" y="73.4531" width="81.8374" height="81.8374" transform="rotate(45 203.825 73.4531)" fill="#B60003" />
        </g>
        <g class="arcana-logo-d" style="--d: 4">
          <rect x="130.935" y="146.343" width="81.8374" height="81.8374" transform="rotate(45 130.935 146.343)" fill="#B60003" />
        </g>
        <g class="arcana-logo-d" style="--d: 1">
          <rect x="281.067" y="0" width="81.8374" height="81.8374" transform="rotate(45 281.067 0)" fill="#DB5825" />
        </g>
        <g class="arcana-logo-d" style="--d: 3">
          <rect x="354.134" y="73.0674" width="81.8374" height="81.8374" transform="rotate(45 354.134 73.0674)" fill="#DB5825" />
        </g>
        <g class="arcana-logo-d" style="--d: 5">
          <rect x="281.245" y="145.957" width="81.8374" height="81.8374" transform="rotate(45 281.245 145.957)" fill="#DB5825" />
        </g>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
